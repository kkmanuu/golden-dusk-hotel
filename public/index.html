<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sunset Hotel - Home</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css"
    />
  </head>
  <body>
    <nav class="main-nav">
      <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="rooms.html">Rooms</a></li>
        <li><a href="dining.html">Dining</a></li>
        <li><a href="amenities.html">Amenities</a></li>
        <li><a href="map.html">Location</a></li>
        <li><a href="contact.html">Contact</a></li>
        <li id="authLink">
          <a href="login.html" class="login-btn">Login</a>
        </li>
      </ul>
    </nav>
    <header>
      <h1>Welcome to Sunset Hotel</h1>
      <p id="welcomeMessage">Luxury Coastal Resort</p>
    </header>

    <!-- Firebase Configuration -->
    <script type="module">
      import { firebaseConfig } from "./js/firebase-config.js";
      import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-app.js";
      import {
        getAuth,
        onAuthStateChanged,
        signOut,
      } from "https://www.gstatic.com/firebasejs/11.6.0/firebase-auth.js";

      const app = initializeApp(firebaseConfig);
      const auth = getAuth(app);

      // Check authentication state
      onAuthStateChanged(auth, (user) => {
        const authLink = document.getElementById("authLink");
        const welcomeMessage = document.getElementById("welcomeMessage");
        if (user) {
          // User is logged in
          const userName = localStorage.getItem("userName") || "Guest";
          authLink.innerHTML = `
                    <span>Welcome, ${userName}</span>
                    <a href="#" id="logoutBtn">Logout</a>
                `;
          welcomeMessage.textContent = `Hello, ${userName}! Enjoy your stay at Sunset Hotel.`;

          // Logout functionality
          document
            .getElementById("logoutBtn")
            .addEventListener("click", async (e) => {
              e.preventDefault();
              try {
                await signOut(auth);
                localStorage.removeItem("token");
                localStorage.removeItem("userEmail");
                localStorage.removeItem("userName");
                window.location.href = "login.html";
              } catch (error) {
                console.error("Error signing out:", error);
              }
            });
        } else {
          // User is not logged in
          authLink.innerHTML =
            '<a href="login.html" class="login-btn">Login</a>';
          welcomeMessage.textContent = "Luxury Coastal Resort";
        }
      });
    </script>
  </body>
</html>
